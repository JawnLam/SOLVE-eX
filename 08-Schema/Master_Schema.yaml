# ==============================================================================
# MASTER SCHEMA FOR OBSIDIAN VAULT PROPERTIES
# ==============================================================================
#
# ⚠️  CRITICAL WARNINGS - READ BEFORE EDITING  ⚠️
#
# CASE SENSITIVITY RULES:
# 1. CORE KEYS: Must be Title_Snake_Case (e.g., "Publication_Date", "Item_ID").
# 2. DOMAIN PREFIXES: Must be lowercase_snake_case (e.g., "gtd_", "crm_", "gov_").
# 3. ACRONYMS: Must be fully capitalized (e.g., "ISBN", "URL", "ID").
#
# UNIVERSAL DECLARATION RULE:
# - EVERY type template in `_types/` MUST declare `type` in
#   its frontmatter, with the value set to the type's exact name.
# - EVERY note instantiated from a type MUST also declare `type`,
#   matching the template it was created from.
# - `type` is the discriminator that tells humans, queries, and
#   automation which schema applies to a note.
# - A note without `type` is malformed. Reject, fix, or treat as
#   `Fleeting` until it can be classified.
# - DOCUMENTED EXEMPTION: Prototypes in the `hugo_*` namespace are exempt from
#   this rule (Hugo_Article, Hugo_Insight, Hugo_Tool). They target the Hugo
#   static site generator, not the Obsidian note system, and use only `hugo_*`
#   fields. See the HUGO IMMUTABILITY RULE below.
#
# HUGO IMMUTABILITY RULE (NON-NEGOTIABLE):
# - ALL Hugo-related properties (any key in the `hugo_*` namespace) and ALL
#   Hugo-related prototype templates (Hugo_Article, Hugo_Insight, Hugo_Tool,
#   and any future `Hugo_*` prototype) MUST remain exactly as they are.
# - DO NOT add, remove, rename, reorder, or otherwise modify any Hugo property
#   or prototype without the user's express permission and direction.
# - DO NOT relocate Hugo prototype files out of `_Prototypes/`.
# - This applies to humans, AI agents, scripts, and automation alike.
# - If a change appears necessary, surface it for explicit approval first.
#
# ==============================================================================

meta:
  version: "1.15.0"
  last_updated: "2026-05-14"
  spec_locked: "2026-05-14"  # Schema v1.15.0 spec locked on 2026-05-14 (Sprint 08 Card 16 — Tool Quality Tiering; added tt_Quality_Tier facet). v1.14.0 spec was locked on 2026-05-13 (Sprint 05 — Schema Foundation; added tt_Applicability). v1.13.0 spec was locked on 2026-05-09 (saturation sweep); project-side library was fully deployed to v1.13.0 on 2026-05-10.
  authority: "Master Schema for Obsidian Vault Infrastructure"
  changelog: "v1.14.0 added four new tt_ facets to make the Thinking Tools library v2.0-ready for the SOLVE eX Co-pilot. (1) tt_SOLVE_eX_Phase (multi-value, enum [1, 2, 3, 4, 5, 6, any]) — which SOLVE eX phase(s) the tool is useful for; primary routing facet for Phase-Step affinity filtering in the v2.0 Tool Selector. (2) tt_SOLVE_eX_Step (multi-value, enum [1.1 through 6.4, any]) — granular step-level affinity; more precise filter than Phase. (3) tt_Clarifies (multi-value, enum [Origin, Destination, Path, Action, None]) — first-cut filter in the Tool Selector: when Destination is Unclear, restrict to tt_Clarifies: Destination tools (eulogy, Ikigai, regret minimization, etc.). (4) tt_Applicability (single-value, enum [runtime_applicable, describable_only, requires_tradition_transmission]) — whether the v2.0 Co-pilot can guide enactment in-session, only describe, or whether the tool requires teacher/lineage transmission. All four properties added to properties: section and registered in the Thinking_Tool prototype's specific_keys. Four new enums added to enums: section. No existing facets, enums, or prototypes were modified. v1.13.0 saturation-sweep refactor of the tt_ namespace. Path B (single-axis Domain) locked: Domain layer now answers exactly one question — 'What cognitive register does this tool operate in?' tt_domains reduced from 16 mixed-axis values to 12 register-clean values (Discursive-analytical, Modes of inquiry, Non-discursive cognition, Embodied / somatic, Inner / psychological work, Symbolic systems, Contemplative, Generative / improvisational, Speculative / imaginative, Emotional cognition, Aesthetic, Phronetic / practical wisdom). Demoted from Domain: Disciplinary traditions → tt_Lineage; Liminal / Play / Speculative-state / Numinous / Flow → new tt_State facet; Collective / Cross-substrate → new tt_Agent facet; Moral / Spatial-temporal-ecological → new tt_About facet or Field absorption. Three new facets added: tt_State (7 values), tt_Agent (6 values), tt_About (14 values, open-extensible at ≥10-tool-applicability threshold). tt_Lineage expanded 13 → 15 values (added Legal / juridical, Medical / clinical to absorb demoted Disciplinary-tradition values for Legal and Clinical reasoning). Refactor was driven by a full saturation sweep with 4-artifact-per-layer Gate 1 + 3-test-per-layer Gate 2 + 7-corpus-test Gate 3 protocol; details in Thinking Tools project's Saturation Sweep.md. Operations also locked at 36 canonical values (35 from the sweep + Cultivate emotion added during Gate 3 corpus test on Buddhist contemplative tradition); canonical inventory remains in Thinking Tools Index, not in Master_Schema (Operation property kept as free string per v1.12.0 'open-but-curated' treatment). v1.12.0 fixed semantic drift in the tt_ namespace: tt_Operation values had degenerated into tool-specific one-liners (one Operation per tool, zero discriminatory value), violating the original 4-layer taxonomy intent (Domain → Field → Operation → Tool). Operation is the layer where multiple Tools sharing the same kind of cognitive move cluster together. tt_Operation property description tightened to make this explicit; all 30 Thinking Tool entries rewritten to use shared Operation values from a 18-value inventory (e.g., 'Score and rank options' shared across Mendelow, Effort Justification Meter, Priority-Based Requirements Matrix, Ease-Impact Matrix). Reverses earlier project-side D9 ('Operations stay emergent') — Operations now have a canonical inventory documented in the Thinking Tools Index. v1.11.0 normalized the tt_ namespace by removing redundant indirection: dropped tt_Domain_Name property entirely; replaced Roman-numeral codes in tt_domains enum with descriptive names. v1.10.0 added the tt_ namespace plus the Thinking_Tool prototype. v1.9.0 added the HUGO IMMUTABILITY RULE. v1.8.0 made the Item_Prototype declaration rule explicit. v1.7.0 added TV_Show prototype."

# ==============================================================================
# 0. NAMESPACES (Controlled Prefixes)
# ==============================================================================
namespaces:
  gtd:  "GTD & Project Management"
  crm:  "Customer Relationship Management (People)"
  hugo: "Static Site Generator Metadata (Restricted Scope)"
  gov:  "Government & Legal (Executive, Legislative, Judicial)"
  lll:  "LifeLong Learning (Subject-Agnostic Study System)"
  drafts: "Drafts App Import Provenance (Capture Origin Metadata)"
  tt:   "Thinking Tools (Library of Cognitive Instruments)"

# ==============================================================================
# 1. CONCEPTUAL TYPES (The "Parents")
# ==============================================================================
concepts:
  Maker:
    description: "Any entity responsible for the creation, editing, or production of the work."
    implementation_keys: [Author, Editor, Host, Guest, Creator, Director, Cast, gov_Judge, gov_Signatory, gov_Sponsor]
    data_type: list
    
  Identifier:
    description: "Unique string that precisely identifies the item in an external system."
    implementation_keys: [Item_ID, DOI, ISBN, ISSN, PMID, arXiv_ID, SSRN_ID, YouTube_ID, Podcast_GUID, IMDb_ID]
    data_type: string

