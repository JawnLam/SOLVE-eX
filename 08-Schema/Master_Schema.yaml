    - custom

  gtd_statuses:
    - "🤔 RAW_task"
    - "🟢 Open_task"
    - "🟡 Pause_task"
    - "🔴 Deprecated_task"
    - "👥 WaitingOn_task"
    - "📆 APPOINTMENT_task"
    - "💭 Someday-Maybe_task"
    - "✅ DONE_task"

  # --- Thinking Tools enums ---
  tt_domains:
    # 12 register-clean Domains. Path B single-axis: each answers
    # "What cognitive register does this tool operate in?"
    # See `! Infrastructure Decision Log.md` v1.13.0 entry for the
    # mapping from the prior 16 mixed-axis Domains to these 12.
    - Discursive-analytical
    - Modes of inquiry
    - Non-discursive cognition
    - Embodied / somatic
    - Inner / psychological work
    - Symbolic systems
    - Contemplative
    - Generative / improvisational
    - Speculative / imaginative
    - Emotional cognition
    - Aesthetic
    - Phronetic / practical wisdom

  tt_types:
    - instrument   # Fillable, deployable tool with template/protocol/rubric
    - stance       # A mode you enter, not an instrument you wield

  tt_forms:
    - Matrix
    - Checklist
    - Dialogue protocol
    - Scoring rubric
    - Mental model
    - Visualization technique
    - Sequenced workflow
    - Question bank
    - Canvas
    - Decision tree
    - Narrative template
    - Heuristic
    - Algorithm
    - Mnemonic
    - Game / simulation
    - Practice / ritual

  tt_scales:
    - Solo
    - Dyadic
    - Small group
    - Large group
    - Organizational
    - Inter-organizational
    - Civilizational

  tt_durations:
    - Snap                # Sub-minute (gut check, intuitive judgment)
    - Single session      # 5 min – 2 hr
    - Workshop            # Half-day to multi-day
    - Project             # Weeks to months
    - Practice            # Lifelong / ongoing discipline

  tt_lineages:
    - Western analytic / academic
    - Eastern philosophical
    - Indigenous / oral traditions
    - Industrial / business
    - Military / strategic
    - Therapeutic / psychological
    - Design / craft tradition
    - Ancient Greek / Roman
    - Religious / monastic
    - Scientific method
    - Mathematical / formal
    - Folk / vernacular
    - Modern productivity / self-help
    - Legal / juridical              # Added v1.13.0 — absorbs demoted Disciplinary tradition for Legal reasoning
    - Medical / clinical             # Added v1.13.0 — absorbs demoted Disciplinary tradition for Clinical reasoning

  tt_postures:
    - Collaborative-willing
    - Adversarial-tolerant
    - Solo-quiet
    - Somatically-regulated
    - Time-pressured-OK
    - Trust-required
    - Low-stakes-only
    - Beginner-friendly
    - Expert-required

  tt_states:                          # Added v1.13.0 — psychological/phenomenological state a tool asks the practitioner to enter or sustain.
    - Liminal                         # Between-states; transitional thresholds
    - Flow                            # Csíkszentmihályi absorbed-engaged
    - Playful                         # Light, generative, low-inhibition
    - Numinous                        # Awe-struck; mysterium tremendum
    - Contemplative-quiet             # Settled, non-grasping, open
    - Speculative-imaginative         # Suspending disbelief; holding multiple worlds
    - Heightened-vigilant             # Adversarial alertness; survival-mode

  tt_agents:                          # Added v1.13.0 — type of cognitive agent doing the work. Distinct from tt_Scale (how many).
    - Solo human                      # Single individual thinking alone
    - Human group                     # Multiple humans co-thinking
    - Crowd / market                  # Aggregated independent humans (prediction markets, Delphi)
    - Human-AI partnership            # Co-thinking with AI system
    - Cross-species                   # Incorporating non-human cognition (cognitive ethology, biophilic)
    - Cross-cultural                  # Bridging cultural cognitive systems

  tt_abouts:                          # Added v1.13.0 — broad subject-of-thought categories. OPEN-EXTENSIBLE at ≥10-tool-applicability threshold; do not silently add singletons.
    - Self / identity
    - Other / relationship
    - Group / organization
    - Power / politics
    - Ethics / values
    - Strategy / competition
    - Decision / choice
    - Risk / uncertainty
    - Time / future
    - Place / ecosystem
    - Body / embodiment
    - Mind / cognition
    - Sacred / transcendent
    - Aesthetic / craft

  tt_solve_ex_phases:                 # Added v1.14.0 — SOLVE eX 6-phase model for routing thinking tools by user journey phase.
    - 1                               # State / Origin clarification
    - 2                               # Objective / Destination clarification
    - 3                               # Learn / fact-gathering
    - 4                               # Vision / divergent path generation
    - 5                               # Evaluate / convergent option assessment
    - 6                               # eXecute / action and follow-through
    - any                             # Cross-phase utility — useful regardless of phase

  tt_solve_ex_steps:                  # Added v1.14.0 — granular SOLVE eX step taxonomy (19 steps across 6 phases + any).
    - 1.1
    - 1.2
    - 1.3
    - 2.1
    - 2.2
    - 2.3
    - 3.1
    - 3.2
    - 3.3
    - 3.4
    - 4.1
    - 4.2
    - 4.3
    - 4.4
    - 5.1
    - 5.2
    - 5.3
    - 6.1
    - 6.2
    - 6.3
    - 6.4
    - any                             # Cross-step utility — useful regardless of step

  tt_clarifies_values:                # Added v1.14.0 — which segment of the user's decision journey the tool clarifies.
    - Origin                          # Where the user currently is
    - Destination                     # Where the user wants to be
    - Path                            # Routes between Origin and Destination
    - Action                          # Executing and following up on chosen path
    - None                            # Structural / meta-process; doesn't clarify any segment directly

  tt_applicability_values:            # Added v1.14.0 — whether the tool is runtime-usable by the v2.0 Co-pilot, descriptive only, or requires lineage transmission.
    - runtime_applicable              # Co-pilot can guide the user through this tool in-session
    - describable_only                # Co-pilot can describe the tool but cannot guide enactment in-session
    - requires_tradition_transmission # Tool requires teacher / lineage / embodied transmission; co-pilot can only point to it

  tt_statuses:
    - proposed       # Name only; no entry yet
    - in-progress    # Entry being drafted
    - classified     # Entry exists with full content
    - deprecated     # Replaced by another tool or no longer recommended

  tt_quality_tiers:                   # Added v1.15.0 — curated quality assessment, independent of tt_Status.
    - A                               # High-quality, well-vetted, frequently load-bearing in real sessions
    - B                               # Solid; appropriate fit for most use cases
    - C                               # Workable; included for completeness; check fit carefully
    - D                               # Marginal; included for breadth; consider alternatives first

# ==============================================================================
# 3. PROPERTIES (The "Atoms")
# The definitive list of all allowed keys.
# ==============================================================================
properties:
  # --- UNIVERSAL CORE (Identity & Naming) ---
  Item_ID:
    type: string
    description: "Internal unique identifier (UUID or custom slug) for the item."
    required: true

  type:
    type: string
    description: "The class or type of the note. MANDATORY for every type template in _types/ and every note instantiated from one — no exceptions. Value must match the type's exact name (e.g., 'Article', 'Book', 'Concept', 'Mental_Model'). This field is the discriminator that tells humans, queries, and automation which schema applies. A note without type is malformed. See the UNIVERSAL DECLARATION RULE at the top of this file."
    required: true

  title:
    type: string
    description: "The full, official title of the work."
    required: true

  SubTitle:
    type: string
    description: "Secondary title."

  Needs_Processing:
    type: boolean
    description: "Flag indicating if this note requires further processing or completion."

  AI_Instructions:
    type: string
    multiline: true
    description: "Free-text instructions for an AI assistant to process this note. Describes what to do with the content — research, expand, reformat, fact-check, convert to another type, merge with another note, etc. Paired with Needs_Processing (the flag says 'process me', this field says 'here is how')."

  # --- UNIVERSAL CORE (The "Maker" Group) ---
  Creator:
    type: list
    description: "Generic primary creator."
  
  Author:
    type: list
    description: "The person(s) who wrote the text."
  
  Editor:
    type: list
    description: "The person(s) responsible for selecting/preparing the text."
  
  Host:
    type: list
    description: "The primary presenter(s) of a podcast or show."
  
  Guest:
    type: list
    description: "Invited participant(s)."

  # --- UNIVERSAL CORE (Time & Location) ---
  Publication_Date:
    type: date
    format: "YYYY-MM-DD"

  URL:
    type: string
    format: url
    legacy_mapping: ["gtd_URL"]

  # --- UNIVERSAL CORE (Content & Discovery) ---
  Abstract:
    type: string
    multiline: true

  KeyWords:
    type: list
    description: "Index Terms (Verbatim)."

  tags:
    type: list
    description: "Taxonomy (Categories)."

  See_Also:
    type: list
    description: "Thesaurus (Related)."

  # --- UNIVERSAL CORE (Utility) ---
  Search_Amazon_URL:
    type: string
    format: url
  
  Search_Google_URL:
    type: string
    format: url
  
  Search_Wikipedia:
    type: string
    format: url
  
  WordCount:
    type: number

  Quick_Notes:
    type: string
    multiline: true

  # --- CONTEXT: BOOKS & ACADEMIC (Prefix-free as they are Core Content) ---
  Book_Title:
    type: string

  Chapter_Title:
    type: string

  Chapter_Number:
    type: number

  Edition:
    type: string

  Volume:
    type: string

  Book_Summary:
    type: string
    multiline: true

  Journal_Name:
    type: string

  Issue:
    type: string

  Journal_Article_Number:
    type: string

  Pages:
    type: string

  # --- IDENTIFIERS ---
  DOI:
    type: string
  DOI_URL:
    type: string
    format: url
  ISBN:
    type: string
  ISSN:
    type: string
  PMID:
    type: string
  arXiv_ID:
    type: string
  SSRN_ID:
    type: string
  YouTube_ID:
    type: string
  Podcast_GUID:
    type: string
  SciHub_URL:
    type: string
    format: url

  # --- CONTEXT: ONLINE / MULTIMEDIA ---
  Platform:
    type: string
    options_ref: platforms

  Brand:
    type: string

  Episode_Number:
    type: number
  
  Season_Number:
    type: number

  Duration:
    type: string
    format: "ISO 8601 Duration"

  # ============================================================================
  # DOMAIN: gtd_ (Project Management)
