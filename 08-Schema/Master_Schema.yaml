  # ============================================================================
  # DOMAIN: tt_ (Thinking Tools — Library of Cognitive Instruments)
  # ============================================================================
  # Faceted classification system for thinking tools. The hierarchy is
  # Domain → Field → Operation → Tool, with cross-cutting facets for Form,
  # Scale, Duration, Lineage, Posture, and tool relationships. See the
  # Thinking Tools project Index for the full taxonomy.

  tt_Source:
    type: string
    description: "Canonical attribution for the tool (e.g., 'Mendelow 1991', 'Lewin 1947', 'SOLVE eX #01', 'Folk / business tradition')."

  tt_Type:
    type: string
    options_ref: tt_types
    description: "Whether the entry is a fillable instrument or a mode you enter."

  tt_Domain:
    type: string
    options_ref: tt_domains
    description: "Top-level Domain in the faceted classification (Path B single-axis, locked v1.13.0). Each Domain answers 'What cognitive register does this tool operate in?' 12 controlled values."

  tt_Field:
    type: string
    description: "Subdivision of a Domain. Maps to academic 'field of study' usage. ~100 Fields inventoried in the Thinking Tools Index."

  tt_Operation:
    type: string
    description: "The shared cognitive operation this tool performs (e.g., 'Score and rank options', 'Map relational topology'). The Operation layer sits between Field and Tool — multiple Tools should share an Operation. NOT a tool-specific summary; for that, use the body of the entry. Treated as an open-but-curated inventory documented in the Thinking Tools Index."

  tt_Cross_Domains:
    type: list
    options_ref: tt_domains
    description: "Other Domains this tool meaningfully spans (e.g., ['Modes of inquiry', 'Disciplinary traditions'])."

  tt_Form:
    type: list
    options_ref: tt_forms
    description: "Shape of the instrument (matrix, checklist, dialogue protocol, etc.). Empty for stance-type entries."

  tt_Scale:
    type: list
    options_ref: tt_scales
    description: "Group size at which the tool operates."

  tt_Duration:
    type: list
    options_ref: tt_durations
    description: "Time signature for using the tool."

  tt_Lineage:
    type: list
    options_ref: tt_lineages
    description: "Source tradition(s) the tool emerges from."

  tt_Posture:
    type: list
    options_ref: tt_postures
    description: "Practitioner-side disposition required for the tool to work as designed (what the work asks of you)."

  tt_State:
    type: list
    options_ref: tt_states
    description: "Psychological/phenomenological state(s) the tool asks the practitioner to enter or sustain. Distinct from tt_Posture: Posture is what you bring; State is what you become. Added v1.13.0."

  tt_Agent:
    type: list
    options_ref: tt_agents
    description: "Type of cognitive agent(s) involved in the tool's enactment. Distinct from tt_Scale: Scale is how many; Agent is what kind (e.g., Human-AI partnership vs Cross-species). Added v1.13.0."

  tt_About:
    type: list
    options_ref: tt_abouts
    description: "Subject matter(s) the tool operates on — the object of thought. Open-extensible at ≥10-tool-applicability threshold (see ! Infrastructure Decision Log v1.13.0). Added v1.13.0."

  tt_SOLVE_eX_Phase:
    type: list
    options_ref: tt_solve_ex_phases
    description: "SOLVE eX phase(s) the tool is useful for. Multi-value: a tool may be useful in multiple phases. Use 'any' for cross-phase utilities. Drives Phase-Step affinity filtering in the v2.0 Tool Selector. Added v1.14.0."

  tt_SOLVE_eX_Step:
    type: list
    options_ref: tt_solve_ex_steps
    description: "Granular SOLVE eX step(s) the tool is useful for. Multi-value: a tool may be useful in multiple steps. Use 'any' for cross-step utilities. More precise than tt_SOLVE_eX_Phase. Added v1.14.0."

  tt_Clarifies:
    type: list
    options_ref: tt_clarifies_values
    description: "Which segment(s) of the user's decision journey the tool clarifies — Origin, Destination, Path, Action, or None. The v2.0 Tool Selector's first-cut filter: when Destination is Unclear, restrict to tools where tt_Clarifies contains 'Destination'. Multi-value allowed. Added v1.14.0."

  tt_Applicability:
    type: string
    options_ref: tt_applicability_values
    description: "Whether the v2.0 Co-pilot can guide the user through this tool at runtime (runtime_applicable), only describe it (describable_only), or whether the tool requires teacher/lineage/embodied transmission (requires_tradition_transmission). Single-value. Added v1.14.0."

  tt_Often_Precedes:
    type: list
    description: "Tools that this one commonly leads into."

  tt_Often_Follows:
    type: list
    description: "Tools that commonly lead into this one."

  tt_Pairs_Well_With:
    type: list
    description: "Tools that combine effectively with this one (no implied order)."

  tt_Replaced_By:
    type: list
    description: "Tools that supersede this one in modern practice."

  tt_Status:
    type: string
    options_ref: tt_statuses
    description: "Lifecycle position of this entry: proposed / in-progress / classified / deprecated."

  tt_Quality_Tier:                    # Added v1.15.0
    type: string
    options_ref: tt_quality_tiers
    description: "Curated quality assessment, independent of tt_Status. A = high quality, frequently load-bearing in real sessions; B = solid, appropriate fit for most use cases; C = workable, included for completeness; D = marginal, included for breadth."

  tt_History:
    type: list
    multiline: true
    description: "Append-only audit trail of significant edits to this entry's classification (e.g., '2026-05-07 — initial classification (v0.4 schema)')."

